# ============================================================
# 容器内的 Nginx 站点配置
#   /            → 前端静态文件（dist）
#   /api/        → 反向代理到 backend:8567
#
# 与宿主机手工部署版（D:\web-ai\nginx\conf\ai-passage.conf）的关键差异：
#   后端地址不是 127.0.0.1，而是 compose 网络里的服务名 backend。
# ============================================================

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 前端产物动辄 1.6MB，gzip 后能压到 500KB 左右，首屏差异很明显
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;

    # SPA 路由回退：vue-router 用 createWebHistory，
    # 刷新 /article/xxx 时磁盘上没有对应文件，必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反向代理
    # proxy_pass 结尾不带斜杠：location 是 /api/，原样转发 /api/xxx，
    # 正好匹配后端 server.servlet.context-path: /api
    location /api/ {
        proxy_pass http://backend:8567;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接：置空 Connection 避免 nginx 用 keep-alive 复用上游连接，
        # 否则一个连接被复用给多个事件流时会串消息
        proxy_set_header Connection '';

        # ---- SSE 三件套 ----
        # 1. 关缓冲：否则事件被攒在 nginx 缓冲区，前端表现为「卡住不动」
        # 2. 关缓存
        # 3. 读超时拉到 1800s：SSE 阶段最长 30 分钟，默认 60s 会切断长连接
        proxy_buffering off;
        proxy_cache     off;
        proxy_read_timeout  1800s;
        proxy_send_timeout  1800s;
    }
}
