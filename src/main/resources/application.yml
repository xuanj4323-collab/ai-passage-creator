spring:
  application:
    name: ai-passage-creator
  # 仅用于本地开发，生产须用启动参数覆盖
  profiles:
    active: dev
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: ${Mysql_Password}
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
  ai:
    deepseek:
      api-key: ${DS_API_KEY}
server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mypj.aipassagecreator.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

unsplash:
  access-key: ${Unsplash_Access-Key}
  api-url: https://api.unsplash.com/search/photos
  default-per-page: 1
  default-orientation: landscape
  connect-timeout: 5000
  read-timeout: 10000

