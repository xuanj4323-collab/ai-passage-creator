spring:
  application:
    name: ai-passage-creator
  # 仅用于本地开发，生产须用启动参数覆盖
  profiles:
    active: dev
  # MySQL 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_passage_creator
    username: root
    password: ${Mysql_Password}
  # session 配置
  session:
    # session 30 天过期
    timeout: 30d
  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password:
  ai:
    deepseek:
      api-key: ${DS_API_KEY}
  mvc:
    async:
      request-timeout: 1800000   # 30 分钟，与 SseEmitter 的超时保持一致
  # 头像等文件上传大小限制（默认 1MB 会拦住 2MB 的头像）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB


server:
  port: 8567
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        name: PASSAGE_SESSION
        max-age: 30d

# springdoc-openapi 配置
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mypj.aipassagecreator.controller
# knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: false

unsplash:
  access-key: ${Unsplash_Access_Key}
  api-url: https://api.unsplash.com/search/photos
  default-per-page: 1
  default-orientation: landscape
  connect-timeout: 5000
  read-timeout: 10000

mermaid:
  cli-command: mmdc.cmd  # CLI 命令（Linux/Mac 下为 mmdc）
  background-color: transparent  # 背景颜色
  output-format: svg  # 输出格式（svg/png/pdf）
  width: 1200  # 图片宽度（像素）
  timeout: 30000  # 命令执行超时时间（毫秒）

# Iconify 图标库配置
iconify:
  api-url: https://api.iconify.design
  search-limit: 10
  default-height: 64
  default-color: ""  # 留空使用 currentColor，或设置如 "#000000"

# 表情包图片检索配置
emoji-pack:
  search-url: https://cn.bing.com/images/async
  suffix: 熊猫头表情包
  timeout: 10000  # 请求超时（毫秒）

# SVG 概念示意图生成配置
svg-diagram:
  default-width: 800
  default-height: 600
  folder: svg-diagrams  # OSS 存储文件夹

# 阿里云 OSS 配置（可选）
aliyun:
  oss:
    access-key-id: ${OSS_ACCESS_KEY_ID}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    region: cn-beijing
    bucket: ai-passage-creator-mypj
    # 对外访问域名（不含协议）；不配置时按 oss-{region}.aliyuncs.com 兜底推导
    endpoint: oss-cn-beijing.aliyuncs.com

dashscope:
  qwen-image:
    base-http-api-url: https://ws-cindfuqih00tmdhy.cn-beijing.maas.aliyuncs.com/api/v1
    aly-api-key: ${ALY_API_KEY}

# Stripe 支付配置
# 密钥统一走环境变量，不写死在代码/仓库里。
# 开发期若是从 IDE 启动、环境变量不方便设置，可用 application-dev.yml 覆盖
# （该文件已被 .gitignore 忽略，不会进仓库）。
stripe:
  api-key: ${STRIPE_API_KEY:}
  # Webhook 验签密钥：留空时应用仍能正常启动，
  # 只有真正接收 Stripe 回调时才会因验签失败报错，不影响其余功能。
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  # 支付完成后浏览器跳回的前端地址。
  # 部署时只改 APP_BASE_URL 一个变量即可，不用再翻代码。
  success-url: ${APP_BASE_URL:http://localhost:5173}/vip?success=true
  cancel-url: ${APP_BASE_URL:http://localhost:5173}/vip?cancelled=true

# 文章智能体配置
article:
  agent:
    orchestrator:
      # 是否启用多智能体编排模式（支持配图并行生成）
      # true: 使用 Spring AI Alibaba 多智能体编排
      # false: 使用原有的 ArticleAgentService
      enabled: true
    # Agent 最大迭代次数
    max-iterations: 10
